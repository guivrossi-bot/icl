<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XPR Regression Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
header{background:#1a1d27;border-bottom:1px solid #2a2d3a;padding:14px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:1.15rem;font-weight:700;color:#fff}
header .badge{font-size:0.72rem;color:#6b7280;background:#2a2d3a;padding:3px 8px;border-radius:4px}
.layout{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 53px)}
.sidebar{background:#1a1d27;border-right:1px solid #2a2d3a;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.section-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:.08em;color:#4b5563;margin-bottom:4px;font-weight:600}
select,input[type=number]{width:100%;background:#0f1117;border:1px solid #2a2d3a;color:#e0e0e0;border-radius:6px;padding:7px 10px;font-size:0.85rem;outline:none}
select:focus,input:focus{border-color:#3b82f6}
input[type=range]{width:100%;accent-color:#3b82f6;cursor:pointer;margin:6px 0}
.thick-display{text-align:center;font-size:2.4rem;font-weight:800;color:#3b82f6;line-height:1}
.thick-display small{font-size:.9rem;color:#6b7280;font-weight:400}
.toggle-row{display:flex;gap:6px}
.tog{flex:1;padding:7px;border:1px solid #2a2d3a;background:#0f1117;color:#9ca3af;border-radius:6px;cursor:pointer;font-size:.8rem;text-align:center;transition:all .12s}
.tog.on{background:#3b82f6;border-color:#3b82f6;color:#fff;font-weight:600}
hr.div{border:none;border-top:1px solid #2a2d3a}
.rc{background:#0f1117;border:1px solid #2a2d3a;border-radius:8px;padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:border-color .12s;border-left:3px solid transparent}
.rc:hover{border-color:#3b82f6}
.rc.sel{border-color:#3b82f6;background:#1a2035}
.rc.interp{border-left-color:#10b981}
.rc.extrap{border-left-color:#f59e0b}
.rc-top{display:flex;justify-content:space-between;align-items:center}
.rc-amp{font-size:1.05rem;font-weight:700;color:#fff}
.rc-spd{font-size:1.1rem;font-weight:700;color:#3b82f6}
.rc-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:.67rem;padding:2px 7px;border-radius:4px;font-weight:500}
.tg{background:#1e3a5f;color:#93c5fd}
.tr{background:#1a3a28;color:#6ee7b7}
.tp{background:#2d1b4e;color:#c4b5fd}
.te{background:#3b2000;color:#fcd34d}
.empty{color:#4b5563;font-size:.82rem;padding:18px;text-align:center}
.main{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:6px;padding:12px 20px 0;border-bottom:1px solid #2a2d3a}
.tab{padding:7px 16px;border-radius:6px 6px 0 0;border:1px solid transparent;background:transparent;color:#6b7280;cursor:pointer;font-size:.82rem;transition:all .12s;border-bottom:none}
.tab.on{background:#1a1d27;color:#fff;border-color:#2a2d3a;border-bottom-color:#1a1d27;margin-bottom:-1px}
.chart-wrap{flex:1;padding:16px;min-height:0;position:relative}
.chart-box{background:#1a1d27;border:1px solid #2a2d3a;border-radius:8px;height:100%;padding:14px;position:relative}
canvas{max-height:100%!important}
.info-bar{padding:0 16px 12px;display:flex;gap:10px;align-items:stretch;min-height:0}
.eq-box{flex:1;background:#0f1117;border:1px solid #2a2d3a;border-radius:6px;padding:10px 14px;font-family:'Courier New',monospace;font-size:.8rem;color:#a5f3fc;line-height:1.6}
.stat-box{background:#0f1117;border:1px solid #2a2d3a;border-radius:6px;padding:8px 16px;text-align:center;min-width:90px}
.stat-v{font-size:1.2rem;font-weight:700;color:#3b82f6}
.stat-l{font-size:.67rem;color:#6b7280;margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>XPR Regression Explorer</h1>
  <span class="badge">Hypertherm XPR R8 (62) + Powermax 65/85/105 SYNC (30) — 92 processos — power-law fit</span>
</header>
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div>
      <div class="section-label">Material</div>
      <select id="matSel" onchange="update()">
        <option value="Mild Steel">Mild Steel (Aço Carbono)</option>
        <option value="Stainless Steel">Stainless Steel (Inox)</option>
        <option value="Aluminum">Aluminum (Alumínio)</option>
      </select>
    </div>

    <div>
      <div class="section-label">Ambiente</div>
      <div class="toggle-row">
        <div class="tog on" id="bAW" onclick="setEnv('AW')">Above Water</div>
        <div class="tog" id="bUW" onclick="setEnv('UW')">Underwater</div>
      </div>
    </div>

    <div>
      <div class="section-label">Máquina</div>
      <div class="toggle-row">
        <div class="tog on" id="bXPR"   onclick="setMachine('XPR')">XPR</div>
        <div class="tog"    id="bPM"    onclick="setMachine('Powermax')">Powermax</div>
        <div class="tog"    id="bAll"   onclick="setMachine('All')">Tudo</div>
      </div>
    </div>

    <div id="qualDiv">
      <div class="section-label">Qualidade (Powermax)</div>
      <div class="toggle-row">
        <div class="tog on" id="bBQ" onclick="setQual('BQ')">Best Quality</div>
        <div class="tog"    id="bHP" onclick="setQual('HP')">High Prod.</div>
      </div>
    </div>

    <div>
      <div class="section-label">Espessura</div>
      <div class="thick-display" id="thkDisp">11.0 <small>mm</small></div>
      <input type="range" id="thkSlider" min="0.5" max="100" step="0.5" value="11" oninput="syncT(this.value)">
      <input type="number" id="thkNum" min="0.1" max="200" step="0.5" value="11" oninput="syncT(this.value)" placeholder="espessura em mm">
    </div>

    <hr class="div">

    <div style="flex:1">
      <div class="section-label" style="margin-bottom:8px">Processos disponíveis &nbsp;<span id="countBadge" style="color:#3b82f6"></span></div>
      <div id="rcList"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="tabs">
      <button class="tab on" id="tCurves" onclick="setTab('curves')">Curvas de Regressão</button>
      <button class="tab" id="tBar" onclick="setTab('bar')">Comparação — Espessura Atual</button>
    </div>
    <div class="chart-wrap">
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </div>
    <div class="info-bar" id="infoBar"></div>
  </div>
</div>

e":"Powermax","material":"Stainless Steel","amperage":65,"plasma_gas":"F5","shield_gas":"F5","environment":"AW","quality":"BQ","a":49389.8358,"b":-1.848444,"r2":1.0,"thickness_range_mm":[4,12],"data_points":[[4,3200],[6,1800],[10,700],[12,500]],"flow_rates":{}},"PM|Stainless Steel|65|F5|F5|AW|HP":{"machine":"Powermax","material":"Stainless Steel","amperage":65,"plasma_gas":"F5","shield_gas":"F5","environment":"AW","quality":"HP","a":65613.2546,"b":-1.847185,"r2":0.9987,"thickness_range_mm":[4,12],"data_points":[[4,4200],[6,2400],[10,900],[12,700]],"flow_rates":{}}};

const PAL=['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#a78bfa','#fb923c','#34d399'];
let env='AW', tab='curves', selKey=null, ch=null, machine='XPR', qual='BQ';

const pl=(x,a,b)=>a*Math.pow(x,b);
const fmt=n=>Math.round(n).toLocaleString('pt-BR');

function models(mat,e){
  return Object.entries(M).filter(([,v])=>{
    if(v.material!==mat) return false;
    if(machine==='XPR' && v.machine!=='XPR') return false;
    if(machine==='Powermax' && v.machine!=='Powermax') return false;
    if(v.machine==='XPR' && v.environment!==e) return false;
    if(v.machine==='Powermax' && v.quality!==qual) return false;
    return true;
  }).sort((a,b)=>a[1].amperage-b[1].amperage);
}

function t(){return parseFloat(document.getElementById('thkNum').value)||11;}
function mat(){return document.getElementById('matSel').value;}

function syncT(v){
  v=parseFloat(v)||0.5;
  document.getElementById('thkSlider').value=Math.min(v,80);
  document.getElementById('thkNum').value=v;
  document.getElementById('thkDisp').innerHTML=v.toFixed(1)+' <small>mm</small>';
  document.getElementById('qualDiv').style.display='none';
update();
}

function setEnv(e){
  env=e;
  document.getElementById('bAW').classList.toggle('on',e==='AW');
  document.getElementById('bUW').classList.toggle('on',e==='UW');
  selKey=null; update();
}

function setMachine(m){
  machine=m;
  document.getElementById('bXPR').classList.toggle('on',m==='XPR');
  document.getElementById('bPM').classList.toggle('on',m==='Powermax');
  document.getElementById('bAll').classList.toggle('on',m==='All');
  // Show UW toggle only for XPR
  const uw=document.getElementById('bUW');
  uw.style.display=(m==='Powermax')?'none':'';
  if(m==='Powermax'&&env==='UW'){env='AW';setEnv('AW');return;}
  // Show quality only for Powermax
  document.getElementById('qualDiv').style.display=(m==='XPR')?'none':'';
  selKey=null; update();
}

function setQual(q){
  qual=q;
  document.getElementById('bBQ').classList.toggle('on',q==='BQ');
  document.getElementById('bHP').classList.toggle('on',q==='HP');
  selKey=null; update();
}

function setTab(tb){
  tab=tb;
  document.getElementById('tCurves').classList.toggle('on',tb==='curves');
  document.getElementById('tBar').classList.toggle('on',tb==='bar');
  renderChart();
}

function update(){renderResults();renderChart();}

function pick(k){
  selKey=selKey===k?null:k;
  document.querySelectorAll('.rc').forEach(c=>c.classList.toggle('sel',c.dataset.k===selKey));
  renderInfo();
  if(tab==='curves')renderChart();
}

function getResults(){
  const T=t(), ms=models(mat(),env), out=[];
  for(const [k,m] of ms){
    const[mn,mx]=m.thickness_range_mm, mg=1.2;
    if(!(mn/mg<=T&&T<=mx*mg))continue;
    const spd=Math.round(pl(T,m.a,m.b));
    out.push({k,m,spd,inRange:mn<=T&&T<=mx,mn,mx});
  }
  return out;
}

function renderResults(){
  const res=getResults(), list=document.getElementById('rcList');
  document.getElementById('countBadge').textContent=res.length?res.length+'':'';
  if(!res.length){list.innerHTML='<div class="empty">Nenhum processo nessa faixa</div>';return;}
  list.innerHTML=res.map(r=>`
    <div class="rc ${r.inRange?'interp':'extrap'} ${r.k===selKey?'sel':''}" data-k="${r.k}" onclick="pick('${r.k}')">
      <div class="rc-top"><span class="rc-amp">${r.m.amperage}A</span><span class="rc-spd">${fmt(r.spd)} mm/min</span></div>
      <div class="rc-tags">
        <span class="tag tg">${r.m.plasma_gas}/${r.m.shield_gas}</span>
        <span class="tag tr">${r.mn}–${r.mx} mm</span>
        <span class="tag tp">R²=${r.m.r2.toFixed(3)}</span>
        ${r.m.machine==='Powermax'?`<span class="tag" style="background:#1c3344;color:#67e8f9">${r.m.quality}</span>`:''}
        ${!r.inRange?'<span class="tag te">extrapol.</span>':''}
      </div>
    </div>`).join('');
  renderInfo();
}

function renderInfo(){
  const bar=document.getElementById('infoBar');
  if(!selKey||!M[selKey]){bar.innerHTML='';return;}
  const m=M[selKey],T=t(),spd=Math.round(pl(T,m.a,m.b));
  bar.innerHTML=`
    <div class="eq-box" style="flex:1">
      <b>${m.amperage}A &nbsp;|&nbsp; ${m.plasma_gas} / ${m.shield_gas} &nbsp;|&nbsp; ${m.environment}</b><br>
      speed = ${m.a.toFixed(1)} &times; thickness<sup>${m.b.toFixed(4)}</sup><br>
      &rarr; speed(${T}mm) = <b>${fmt(spd)} mm/min</b>
    </div>
    <div class="stat-box"><div class="stat-v">${m.amperage}A</div><div class="stat-l">Corrente</div></div>
    <div class="stat-box"><div class="stat-v">${fmt(spd)}</div><div class="stat-l">mm/min @ ${T}mm</div></div>
    <div class="stat-box"><div class="stat-v">${m.r2.toFixed(3)}</div><div class="stat-l">R²</div></div>
    <div class="stat-box"><div class="stat-v">${m.thickness_range_mm[0]}–${m.thickness_range_mm[1]}</div><div class="stat-l">Faixa (mm)</div></div>`;
}

function renderChart(){
  if(ch){ch.destroy();ch=null;}
  const ctx=document.getElementById('chart').getContext('2d');
  tab==='curves'?drawCurves(ctx):drawBar(ctx);
}

function drawCurves(ctx){
  const ms=models(mat(),env), T=t(), ds=[];
  let ci=0;
  for(const [k,m] of ms){
    const c=PAL[ci%PAL.length]; ci++;
    const [mn,mx]=m.thickness_range_mm;
    const xs=[]; for(let x=mn*.9;x<=mx*1.1;x+=(mx-mn)/100)xs.push(x);
    const hl=k===selKey;
    ds.push({label:`${m.amperage}A (${m.plasma_gas}/${m.shield_gas}) R²=${m.r2.toFixed(3)}`,
      data:xs.map(x=>({x,y:Math.round(pl(x,m.a,m.b))})),
      borderColor:c,backgroundColor:'transparent',borderWidth:hl?3:1.5,pointRadius:0,tension:.3,type:'line'});
    ds.push({label:`_${k}`,data:m.data_points.map(([px,py])=>({x:px,y:py})),
      borderColor:c,backgroundColor:c+'aa',pointRadius:hl?6:3,showLine:false,type:'scatter'});
  }
  ds.push({label:`← ${T}mm`,data:[{x:T,y:0},{x:T,y:20000}],
    borderColor:'#ffffff33',borderWidth:1,borderDash:[5,4],pointRadius:0,type:'line'});
  ch=new Chart(ctx,{type:'scatter',data:{datasets:ds},options:{
    responsive:true,maintainAspectRatio:false,animation:false,
    plugins:{legend:{labels:{color:'#9ca3af',font:{size:10},filter:i=>!i.text.startsWith('_')}}},
    scales:{
      x:{type:'linear',title:{display:true,text:'Espessura (mm)',color:'#9ca3af'},grid:{color:'#2a2d3a'},ticks:{color:'#9ca3af'}},
      y:{title:{display:true,text:'Velocidade (mm/min)',color:'#9ca3af'},grid:{color:'#2a2d3a'},ticks:{color:'#9ca3af'}}
    }
  }});
}

function drawBar(ctx){
  const res=getResults();
  if(!res.length)return;
  ch=new Chart(ctx,{type:'bar',data:{
    labels:res.map(r=>`${r.m.amperage}A\n${r.m.plasma_gas}`),
    datasets:[{
      label:'Velocidade prevista (mm/min)',
      data:res.map(r=>r.spd),
      backgroundColor:res.map(r=>r.inRange?'#10b98199':'#f59e0b99'),
      borderColor:res.map(r=>r.inRange?'#10b981':'#f59e0b'),
      borderWidth:1,borderRadius:5
    }]
  },options:{
    responsive:true,maintainAspectRatio:false,animation:false,
    plugins:{legend:{labels:{color:'#9ca3af'}},
      tooltip:{callbacks:{label:c=>`${fmt(c.parsed.y)} mm/min  R²=${res[c.dataIndex].m.r2.toFixed(3)}`}}},
    scales:{
      x:{ticks:{color:'#9ca3af'},grid:{color:'#2a2d3a'}},
      y:{title:{display:true,text:'Velocidade (mm/min)',color:'#9ca3af'},ticks:{color:'#9ca3af'},grid:{color:'#2a2d3a'}}
    }
  }});
}

update();
</script>
</body>
</html>
